[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagliktan-kesif-api"
version = "1.0.0"
description = "Sağlıktan Keşif — literatür tabanlı ilaç yeniden konumlandırma platformu (motor + REST API)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  # motor (bilimsel çekirdek)
  "requests>=2.31",
  "pandas>=2.0",
  # uygulama / API
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.25",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "rq>=1.16",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "fakeredis>=2.23",
]

[project.scripts]
kesif = "kesif_server.interfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kesif_engine = ["resources/*.json"]
kesif_server = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["E501", "E741", "RUF001", "RUF002", "RUF003", "UP007", "UP006", "UP035", "UP045", "B008", "RUF012", "RUF005", "RUF015", "RUF046", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["kesif_engine", "kesif_server"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["kesif_server"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
