# Geliştirme veritabanı: yalnızca PostgreSQL, yalnızca bu bilgisayardan erişilir (127.0.0.1).
# Kullanım: POSTGRES_PASSWORD=... docker compose -f docker-compose.dev.yml up -d
# .env içinde: KESIF_DATABASE_URL=postgresql+psycopg://kesif:<parola>@localhost:5433/kesif
# Port varsayılan 5433 (5432 çoğu bilgisayarda başka bir PostgreSQL tarafından kullanılıyor); KESIF_PG_PORT ile değişir.
name: sagliktan-kesif-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kesif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: kesif
    ports:
      - "127.0.0.1:${KESIF_PG_PORT:-5433}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kesif -d kesif"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata-dev:
