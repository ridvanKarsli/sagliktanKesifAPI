name: sagliktan-kesif

x-backend-env: &backend-env
  KESIF_ENV: ${KESIF_ENV:-prod}
  KESIF_LOG_JSON: "true"
  KESIF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kesif}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/${POSTGRES_DB:-kesif}
  KESIF_QUEUE_BACKEND: redis
  KESIF_REDIS_URL: redis://redis:6379/0
  KESIF_AUTH_MODE: ${KESIF_AUTH_MODE:-local}
  KESIF_JWT_SECRET: ${KESIF_JWT_SECRET:?KESIF_JWT_SECRET gerekli}
  KESIF_BOOTSTRAP_ADMIN_EMAIL: ${KESIF_BOOTSTRAP_ADMIN_EMAIL:-}
  KESIF_BOOTSTRAP_ADMIN_PASSWORD: ${KESIF_BOOTSTRAP_ADMIN_PASSWORD:-}
  KESIF_OIDC_ISSUER: ${KESIF_OIDC_ISSUER:-}
  KESIF_OIDC_AUDIENCE: ${KESIF_OIDC_AUDIENCE:-}
  KESIF_CORS_ORIGINS: ${KESIF_CORS_ORIGINS:-https://kesif.sagliktan.com}
  KESIF_DOCS_ENABLED: ${KESIF_DOCS_ENABLED:-false}
  KESIF_NCBI_API_KEY: ${KESIF_NCBI_API_KEY:-}
  KESIF_NCBI_EMAIL: ${KESIF_NCBI_EMAIL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kesif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-kesif}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kesif} -d ${POSTGRES_DB:-kesif}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["kesif", "migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *backend-env
    volumes:
      - engine-work:/app/work   # yalnızca önbellek; kalıcı veri PostgreSQL'de
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  worker:
    build: .
    command: ["kesif", "worker"]
    environment: *backend-env
    volumes:
      - engine-work:/app/work   # yalnızca önbellek; kalıcı veri PostgreSQL'de
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped

  frontend:
    build: ${FRONTEND_CONTEXT:-../frontend}
    image: ${FRONTEND_IMAGE:-sagliktan-kesif-web:latest}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  engine-work:
